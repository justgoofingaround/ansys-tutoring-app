# Tutoring Hub — nginx (dockerized) for meuy4214.poly.edu.
# Mounted by deploy/docker-compose.yml as /etc/nginx/conf.d/default.conf
# inside the nginx container. Chosen over host nginx because the container
# runs outside the host's SELinux httpd_t domain, so no setsebool (root)
# is needed to proxy to the app.

server {
    listen 80;
    server_name meuy4214.poly.edu;
    # ACME webroot for certbot renewals (shared volume, see runbook §4)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name meuy4214.poly.edu;

    ssl_certificate     /etc/letsencrypt/live/meuy4214.poly.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meuy4214.poly.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Report uploads are capped at 20 MB server-side; give nginx headroom.
    client_max_body_size 25m;

    location / {
        proxy_pass http://hub:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compass chat streams server-sent events — don't buffer them.
    location /api/chatbot/ {
        proxy_pass http://hub:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
