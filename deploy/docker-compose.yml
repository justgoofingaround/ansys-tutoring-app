# Tutoring Hub — NYU pilot deployment (meuy4214.poly.edu).
# Two services: the app (hub) and nginx terminating TLS in a container
# (nginx-docker.conf; certs mounted read-only from the host's letsencrypt).
# Data persists in ../server_data on the host.
#
# AI IS DISABLED for the pilot (NYU security review): no Ollama service, no
# model, no retrieval index, and ENABLE_AI=0 so the app mounts no AI routes.
# To re-enable after clearance see deploy/DEPLOY-NYU.md §6.
#
#   docker compose --env-file .env up -d --build
#
services:
  hub:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        WITH_COMPASS: "0"   # no Compass doc search: skips torch/chromadb and drops chatbot_spike/
    container_name: tutoring-hub
    restart: unless-stopped
    # Bind to loopback only — the outside world comes in through nginx:443.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      INSTRUCTOR_USERNAME: ${INSTRUCTOR_USERNAME:?set in deploy/.env}
      INSTRUCTOR_PASSWORD: ${INSTRUCTOR_PASSWORD:?set in deploy/.env}
      SEED_ALL_TUTORIALS: "1"
      COOKIE_SECURE: "1"           # nginx serves HTTPS
      DATA_DIR: /app/server_data
      # Master AI switch — off for the pilot. With this unset/0 the app forces
      # ENABLE_LLM off and ignores CHATBOT_API_KEY, so no generation path can
      # run even if another variable is set by mistake.
      ENABLE_AI: "0"
      ENABLE_LLM: "0"
      # Registration confirmation mail. Unset SMTP_HOST -> the app logs the link
      # instead of sending, and the instructor admits students from the class
      # list; set it and real email starts working with no code change.
      # host.docker.internal reaches a mail server running on the HOST (e.g. the
      # box's own Postfix on :25) from inside the container; a campus relay
      # hostname works too. Most on-network relays need no username/password.
      APP_BASE_URL: ${APP_BASE_URL:-https://meuy4214.poly.edu}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@meuy4214.poly.edu}
    extra_hosts:
      # Lets SMTP_HOST=host.docker.internal find the host's own mail server.
      - "host.docker.internal:host-gateway"
    volumes:
      - ../server_data:/app/server_data

  nginx:
    image: nginx:1.27-alpine
    container_name: tutoring-hub-nginx
    restart: unless-stopped
    depends_on:
      - hub
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot

volumes:
  certbot-webroot:
