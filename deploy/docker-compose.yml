# Tutoring Hub — NYU pilot deployment (meuy4214.poly.edu).
# Three services: the app (hub), nginx terminating TLS in a container
# (nginx-docker.conf; certs mounted read-only from the host's letsencrypt),
# and a local Ollama LLM server reachable only from the hub.
# Data persists in ../server_data on the host.
#
#   docker compose --env-file .env up -d --build
#
services:
  hub:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tutoring-hub
    restart: unless-stopped
    # Bind to loopback only — the outside world comes in through nginx:443.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      INSTRUCTOR_USERNAME: ${INSTRUCTOR_USERNAME:?set in deploy/.env}
      INSTRUCTOR_PASSWORD: ${INSTRUCTOR_PASSWORD:?set in deploy/.env}
      SEED_ALL_TUTORIALS: "1"
      COOKIE_SECURE: "1"           # nginx serves HTTPS
      DATA_DIR: /app/server_data
      # Local AI (report review, FAQ drafting, PDF->tutorial) through the
      # ollama service below, over the compose network.
      ENABLE_LLM: "1"
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ../server_data:/app/server_data

  nginx:
    image: nginx:1.27-alpine
    container_name: tutoring-hub-nginx
    restart: unless-stopped
    depends_on:
      - hub
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot

  # Local LLM for AI report review, FAQ drafting, and PDF->tutorial. Runs as a
  # container rather than a host install: no root needed, and the hub reaches
  # it over the compose network, so the host's SELinux policy is never
  # involved (the same reason nginx is dockerized). No ports: it is not
  # reachable from the network. After first start, pull the model:
  #   docker exec tutoring-hub-ollama ollama pull gemma3:4b
  ollama:
    image: ollama/ollama
    container_name: tutoring-hub-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

volumes:
  certbot-webroot:
  ollama-models:
