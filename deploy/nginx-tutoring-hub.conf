# Tutoring Hub — nginx site config for meuy4214.poly.edu.
# Install:  sudo cp deploy/nginx-tutoring-hub.conf /etc/nginx/sites-available/tutoring-hub
#           sudo ln -s /etc/nginx/sites-available/tutoring-hub /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Adjust ssl_certificate paths to wherever your NYU-issued cert lands.

server {
    listen 80;
    listen [::]:80;
    server_name meuy4214.poly.edu;
    # Let certbot's webroot challenge through if you use Let's Encrypt.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meuy4214.poly.edu;

    ssl_certificate     /etc/ssl/tutoring-hub/fullchain.pem;
    ssl_certificate_key /etc/ssl/tutoring-hub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Report uploads are capped at 20 MB server-side; give nginx headroom.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compass chat streams server-sent events — don't buffer them.
    location /api/chatbot/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
