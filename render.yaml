# Render blueprint — free-tier team-testing deployment.
# In the Render dashboard: New + -> Blueprint -> connect this repo.
# Set INSTRUCTOR_PASSWORD in the dashboard when prompted (never in git).
services:
  - type: web
    name: tutoring-hub
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: INSTRUCTOR_USERNAME
        value: prof
      - key: INSTRUCTOR_PASSWORD
        sync: false
      - key: ENABLE_LLM
        value: "0"
      # Compass chatbot in the cloud: paste a free API key (e.g. Groq —
      # console.groq.com) when prompted, or leave blank to keep the chatbot
      # disabled. Any OpenAI-compatible endpoint works via CHATBOT_API_BASE.
      - key: CHATBOT_API_KEY
        sync: false
      - key: CHATBOT_API_BASE
        value: "https://api.groq.com/openai/v1"
      # Groq retired the llama-3.1 models (Aug 2026); gpt-oss-20b is the
      # current fast free-tier model. It's a reasoning model — token limits
      # in the code leave headroom for its reasoning tokens.
      - key: CHATBOT_MODEL
        value: "openai/gpt-oss-20b"
